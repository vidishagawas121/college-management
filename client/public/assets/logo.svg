<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="maroonHex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64162e" />
      <stop offset="100%" stop-color="#420d1c" />
    </linearGradient>
    <linearGradient id="goldCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd56b" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>
  <!-- Hexagon Shape -->
  <polygon points="50,4 92,26 92,74 50,96 8,74 8,26" fill="url(#maroonHex)" stroke="#d9a52a" stroke-width="1.5" stroke-opacity="0.3" stroke-linejoin="round" />
  
  <!-- Subtle inner dashed contour -->
  <polygon points="50,8 88,28 88,72 50,92 12,72 12,28" fill="none" stroke="#d9a52a" stroke-width="0.75" stroke-dasharray="2 2" stroke-opacity="0.4" stroke-linejoin="round" />

  <!-- Graduation Mortarboard Top -->
  <polygon points="50,28 78,42 50,54 22,42" fill="url(#goldCap)" />
  <!-- Skull Cap Base -->
  <path d="M34,48 L34,60 Q50,70 66,60 L66,48 Q50,56 34,48 Z" fill="#ffffff" opacity="0.95" />
  <!-- Tassel -->
  <path d="M72,44 L75,60 L71,67 L79,67 L75,60" fill="url(#goldCap)" />
  <circle cx="50" cy="41" r="2.5" fill="#ffffff" opacity="0.8" />
  
  <!-- Tiny Stars at bottom -->
  <polygon points="50,76 52,81 57,81 53,84 55,89 50,86 45,89 47,84 43,81 48,81" fill="url(#goldCap)" />
  <circle cx="38" cy="78" r="1.5" fill="url(#goldCap)" />
  <circle cx="62" cy="78" r="1.5" fill="url(#goldCap)" />
</svg>
