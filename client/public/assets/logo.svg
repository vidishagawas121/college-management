<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a8a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="40" fill="url(#grad1)" />
  <circle cx="100" cy="100" r="75" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="8 4" opacity="0.6"/>
  <!-- Graduation Cap -->
  <polygon points="100,55 155,80 100,105 45,80" fill="url(#goldGrad)" />
  <polygon points="65,95 65,120 100,138 135,120 135,95 100,112" fill="#ffffff" opacity="0.9" />
  <!-- Tassel -->
  <path d="M145,82 L150,115 L142,128 L158,128 L150,115" fill="#f59e0b" />
  <!-- Laurel / Stars -->
  <polygon points="100,150 104,160 115,160 106,167 110,178 100,171 90,178 94,167 85,160 96,160" fill="url(#goldGrad)" />
</svg>
